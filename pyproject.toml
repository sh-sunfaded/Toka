[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoka"
version = "0.3.1"
description = "Toolkit for analyzing the KONN packer format (self-decrypting Stage0 packer, SPN chain cipher, rol13 rolling layer, Huffman/LZSS bytecode VM)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "sh-sunfaded" }]
keywords = ["konn", "packer", "unpacker", "virtual-machine", "bytecode", "huffman", "lzss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/sh-sunfaded/Toka"
Repository = "https://github.com/sh-sunfaded/Toka"
Issues = "https://github.com/sh-sunfaded/Toka/issues"

[project.scripts]
toka = "toka.cli:main"

[project.optional-dependencies]
fast = ["numpy>=1.26"]
emu = ["unicorn>=2.0"]
disasm = ["capstone>=5.0"]

[tool.setuptools]
packages = ["toka"]
